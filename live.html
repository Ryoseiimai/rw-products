<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE — RYOSEIWORLD AI 司令塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --fg: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #3ddc84;
    --warn: #e0b03d;
    --off: #666;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 40px 20px 8px;
    text-align: center;
  }
  header .brand {
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--muted);
  }
  header a.back {
    display: inline-block;
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid #333;
  }
  header a.back:hover { color: var(--fg); }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    text-align: center;
  }

  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 28px;
    border: 1px solid #222;
    border-radius: 999px;
    margin-bottom: 56px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.running {
    background: var(--accent);
    animation: pulse 1.8s infinite;
  }
  .dot.waiting {
    background: var(--warn);
  }
  .dot.stopped {
    background: var(--off);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.55); }
    70% { box-shadow: 0 0 0 10px rgba(61, 220, 132, 0); }
    100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); }
  }
  .status-label {
    font-size: 16px;
    letter-spacing: 0.1em;
    font-weight: 700;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr; gap: 32px; }
  }
  .stat .num {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat .label {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .updated {
    margin-top: 64px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="brand">RYOSEIWORLD — AI 司令塔 LIVE</div>
  <a class="back" href="index.html">← PRODUCTS へ戻る</a>
</header>

<main>
  <div class="status-indicator">
    <span class="dot waiting" id="dot"></span>
    <span class="status-label" id="status-label">集計待ち</span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="exec24">—</div>
      <div class="label">直近24時間の実行数</div>
    </div>
    <div class="stat">
      <div class="num" id="doneTotal">—</div>
      <div class="label">累計 完了数</div>
    </div>
    <div class="stat">
      <div class="num" id="attemptsTotal">—</div>
      <div class="label">総試行数</div>
    </div>
  </div>

  <div class="updated" id="updated">最終更新: 集計待ち</div>
</main>

<script>
  const STATUS_MAP = {
    RUNNING: { label: "稼働中", dot: "running" },
    WAITING: { label: "待機中", dot: "waiting" },
    STOPPED: { label: "停止中", dot: "stopped" },
  };

  async function load() {
    try {
      const res = await fetch("data/status.json", { cache: "no-store" });
      if (!res.ok) throw new Error("status.json not found");
      const data = await res.json();

      const meta = STATUS_MAP[data.status] || { label: "集計待ち", dot: "waiting" };
      document.getElementById("status-label").textContent = meta.label;
      const dot = document.getElementById("dot");
      dot.className = `dot ${meta.dot}`;

      document.getElementById("exec24").textContent = Number.isFinite(data.exec_24h) ? data.exec_24h : "—";
      document.getElementById("doneTotal").textContent = Number.isFinite(data.done_total) ? data.done_total : "—";
      document.getElementById("attemptsTotal").textContent = Number.isFinite(data.attempts_total) ? data.attempts_total : "—";

      if (data.updated) {
        const d = new Date(data.updated);
        const formatted = isNaN(d.getTime()) ? data.updated : d.toLocaleString("ja-JP");
        document.getElementById("updated").textContent = `最終更新: ${formatted}`;
      }
    } catch (e) {
      // データが無い/壊れている場合は壊れず「集計待ち」のままにする
      document.getElementById("updated").textContent = "最終更新: 集計待ち";
    }
  }
  load();
</script>

</body>
</html>
