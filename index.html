<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYOSEIWORLD — AI PRODUCTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --fg: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #3ddc84;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  header {
    padding: 48px 32px 24px;
    text-align: center;
  }
  header .brand {
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--muted);
    font-weight: 500;
  }
  .live-band {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 20px auto 0;
    padding: 10px 20px;
    max-width: fit-content;
    border: 1px solid #222;
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.08em;
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .live-band:hover {
    border-color: var(--accent);
    background: rgba(61, 220, 132, 0.06);
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.7);
    animation: pulse 1.8s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(61, 220, 132, 0); }
    100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); }
  }
  nav.filters {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 28px 16px 8px;
  }
  nav.filters button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.05em;
    cursor: pointer;
    padding: 4px 2px;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  nav.filters button:hover {
    color: var(--fg);
  }
  nav.filters button.active {
    color: var(--fg);
    border-bottom-color: var(--accent);
  }
  main {
    padding: 24px 20px 80px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    header { padding: 32px 16px 16px; }
  }
  .tile {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border-radius: 4px;
    background: #111;
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .tile[hidden] { display: none; }
  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.85) brightness(0.85);
    transform: scale(1);
    transition: transform 0.5s ease, filter 0.5s ease;
  }
  .tile:hover img {
    transform: scale(1.06);
    filter: saturate(1.15) brightness(1);
  }
  .tile:hover {
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 20px 40px rgba(0,0,0,0.6);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 14px;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .tile:hover .overlay {
    opacity: 1;
  }
  .overlay .name {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .overlay .desc {
    font-size: 11px;
    color: #cfcfcf;
    margin: 0;
    line-height: 1.5;
  }
  footer {
    padding: 40px 20px 60px;
    text-align: center;
    border-top: 1px solid #1a1a1a;
    color: var(--muted);
    font-size: 12px;
    line-height: 2;
  }
  footer a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid #333;
  }
  footer a:hover {
    border-bottom-color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="brand">RYOSEIWORLD — AI PRODUCTS</div>
  <a class="live-band" href="live.html">
    <span class="pulse-dot"></span>
    LIVE — 24時間AI司令塔が稼働中
  </a>
</header>

<nav class="filters" id="filters">
  <button data-cat="ALL" class="active">ALL</button>
  <button data-cat="ツール">ツール</button>
  <button data-cat="サイト">サイト</button>
  <button data-cat="ゲーム">ゲーム</button>
  <button data-cat="アプリ">アプリ</button>
</nav>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div><a href="https://ryoseiworld.co.jp/" target="_blank" rel="noopener">RYOSEIWORLD合同会社</a></div>
  <div>AIで事業や会社を自動化したい方は<a href="https://freehp.jp/jidoka.html" target="_blank" rel="noopener">連絡ください</a></div>
</footer>

<script>
  // 掲載データ。desc は各サイトの実内容に即した30字以内の説明。
  const PRODUCTS = [
    { name: "RYOSEI GALAXY", slug: "ryosei-galaxy", url: "https://ryoseiimai.github.io/ryosei-galaxy/", desc: "部署をぜんぶAIにした会社の組織図", category: "サイト" },
    { name: "freehp AIチーム", slug: "freehp-ai-team", url: "https://ryoseiimai.github.io/freehp-ai-team/", desc: "freehpを支えるAIチームの稼働状況", category: "サイト" },
    { name: "BOSS BATTLE", slug: "ryoseiworld-game", url: "https://ryoseiimai.github.io/ryoseiworld-game/", desc: "ブラウザで戦うボスバトルゲーム", category: "ゲーム" },
    { name: "かえるぱち", slug: "one-image-pachi", url: "https://ryoseiimai.github.io/one-image-pachi/", desc: "ブラウザで遊べる自作パチンコ台", category: "ゲーム" },
    { name: "東京 日サロランキング2026", slug: "nissaro-ranking", url: "https://ryoseiimai.github.io/nissaro-ranking/", desc: "都内12店の日焼けサロンを比較", category: "サイト" },
    { name: "Facebookプロフィール整備キット", slug: "fb-profile-kit", url: "https://ryoseiimai.github.io/fb-profile-kit/", desc: "肩書きが変わったら3問で更新できる", category: "ツール" },
    { name: "ちょうせいちゃん", slug: "chosei-kun", url: "https://ryoseiimai.github.io/chosei-kun/", desc: "空き時間から日程の候補を作る", category: "アプリ" },
    { name: "CAMPセットアップ診断くん", slug: "camp-setup-kun", url: "https://ryoseiimai.github.io/camp-setup-kun/", desc: "受講生のPC初期設定を12手順で診断", category: "ツール" },
    { name: "落とし物ナビ（東京）", slug: "otoshimono-navi", url: "https://ryoseiimai.github.io/otoshimono-navi/", desc: "探す・届けるの窓口へ迷わず行ける", category: "ツール" },
    { name: "総当たりスコアボード", slug: "round-robin-scoreboard", url: "https://ryoseiimai.github.io/round-robin-scoreboard/", desc: "4チーム総当たり2周の得点記録アプリ", category: "アプリ" },
    { name: "遊戯王 1103環境シミュレーター", slug: "ygo-1103-sim", url: "https://ryoseiimai.github.io/ygo-1103-sim/", desc: "1103環境を練習できる対戦シミュ", category: "ゲーム" },
    { name: "月間イベントカレンダーくん", slug: "event-calendar-kun", url: "https://ryoseiimai.github.io/event-calendar-kun/", desc: "印刷用の月間イベント表を作る", category: "ツール" },
    { name: "スライド章分割ツール", slug: "slide-chapter-splitter", url: "https://ryoseiimai.github.io/slide-chapter-splitter/", desc: "スライドPDFを章ごとに分けて台本化", category: "ツール" },
    { name: "月詠茶寮", slug: "tsukuyomi-saryo", url: "https://ryoseiimai.github.io/tsukuyomi-saryo/", desc: "月相と星座でお茶を選ぶ物販デモ", category: "サイト" },
    { name: "RYOSEI CART", slug: "ryosei-cart", url: "https://ryoseiimai.github.io/ryosei-cart/", desc: "3Dで走るブラウザレースゲーム", category: "ゲーム" },
    { name: "AIホール 店舗ツール集", slug: "pachinko-store-tools", url: "https://ryoseiimai.github.io/pachinko-store-tools/", desc: "パチンコ店向けの無料ツール4本", category: "ツール" },
    { name: "涼丸産業", slug: "ai-pachinko-maker", url: "https://ryoseiimai.github.io/ai-pachinko-maker/", desc: "AIがパチンコ台を作るメーカー体験", category: "ツール" },
    { name: "外部記憶ターミナル", slug: "gaibu-kioku-statusline", url: "https://ryoseiimai.github.io/gaibu-kioku-statusline/", desc: "忘れる人のための記憶ステータス表示", category: "ツール" },
    { name: "CR AIホール", slug: "ai-pachinko-sim", url: "https://ryoseiimai.github.io/ai-pachinko-sim/", desc: "架空機種のパチンコシミュレーター", category: "ゲーム" },
    { name: "リンクまとめ", slug: "links", url: "https://imai-design.github.io/links/", desc: "本人の全リンクを一枚に集約したページ", category: "サイト" },
    { name: "ADHD村", slug: "adhd-mura", url: "https://imai-design.github.io/adhd-mura/", desc: "ADHD当事者が集うコミュニティ紹介", category: "サイト" },
    { name: "Narabe", slug: "narabe", url: "https://imai-design.github.io/narabe/", desc: "ホーム画面を並べて楽しむウィジェット", category: "アプリ" },
    { name: "Claude教", slug: "claude-kyoso", url: "https://imai-design.github.io/claude-kyoso/", desc: "クロード卿のもと国を作る参加型企画", category: "サイト" },
    { name: "HP健康診断", slug: "hp-shindan", url: "https://imai-design.github.io/hp-shindan/", desc: "お店のホームページを無料で診断する", category: "ツール" },
    { name: "年収シミュレーション診断", slug: "nenshu-shindan", url: "https://imai-design.github.io/nenshu-shindan/", desc: "AI人材としての年収を診断するツール", category: "ツール" },
    { name: "携帯コックピット", slug: "keitai", url: "https://imai-design.github.io/keitai/", desc: "スマホから自宅Macを遠隔操作する画面", category: "ツール" },
    { name: "GEMINI関数の作り方", slug: "sheets-gemini", url: "https://imai-design.github.io/sheets-gemini-function/", desc: "スプレッドシート用カスタム関数の解説", category: "ツール" },
    { name: "まよなかのケーキ事件", slug: "mayonaka-cake", url: "https://imai-design.github.io/mayonaka-cake/", desc: "ブラウザで遊べる推理ゲーム", category: "ゲーム" },
    { name: "おかね見えるくん", slug: "okane-mieru-kun", url: "https://imai-design.github.io/okane-mieru-kun/", desc: "月収を秒で可視化する無料ツール", category: "ツール" },
    { name: "Instagram投稿画像作成", slug: "insta-card-kit", url: "https://imai-design.github.io/insta-card-kit/", desc: "お金をかけずに投稿画像を作るキット", category: "ツール" },
    { name: "freehp", slug: "freehp", url: "https://freehp.jp/", desc: "AIがホームページを翌日に届けるサービス", category: "サイト" },
    { name: "AI自動化のご相談", slug: "freehp-jidoka", url: "https://freehp.jp/jidoka.html", desc: "事業や会社の仕事をAIで自動化する窓口", category: "サイト" },
    { name: "配送受付デモ", slug: "butler-demo", url: "https://Ryoseiimai.github.io/butler-delivery-demo/", desc: "注文受付と配送料確認を自動化するデモ", category: "アプリ" },
    { name: "RYOSEIWORLD公式", slug: "ryoseiworld", url: "https://ryoseiworld.co.jp/", desc: "やりたいことで生きていく合同会社の顔", category: "サイト" },
  ];

  const grid = document.getElementById("grid");

  function render() {
    grid.innerHTML = "";
    for (const p of PRODUCTS) {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = p.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.dataset.category = p.category;
      a.innerHTML = `
        <img src="assets/thumbs/${p.slug}.jpg" alt="${p.name}" loading="lazy">
        <div class="overlay">
          <p class="name">${p.name}</p>
          <p class="desc">${p.desc}</p>
        </div>
      `;
      grid.appendChild(a);
    }
  }
  render();

  const filters = document.getElementById("filters");
  filters.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    filters.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    const cat = btn.dataset.cat;
    document.querySelectorAll(".tile").forEach((tile) => {
      tile.hidden = cat !== "ALL" && tile.dataset.category !== cat;
    });
  });
</script>

</body>
</html>
